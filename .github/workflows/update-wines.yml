name: Update wine list (fortnightly)

# Runs on the 1st and 15th of every month (~fortnightly) at 06:00 UTC,
# and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh wines.json
        run: python scripts/update_wines.py

      - name: Commit changes if any
        run: |
          git config user.name "pour-decisions-bot"
          git config user.email "actions@github.com"
          if [[ -n "$(git status --porcelain data/wines.json)" ]]; then
            git add data/wines.json
            git commit -m "chore: fortnightly wine list refresh"
            git push
          else
            echo "No changes to the wine list."
          fi
